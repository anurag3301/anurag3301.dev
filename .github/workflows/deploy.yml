name: Deploy

on:
  push:
    branches:
      - master  # Adjust branch as needed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH Port
        run: |
          timeout 10 nc -vz ${{ secrets.HOST }} ${{ secrets.PORT }}

      - name: SSH into VPS and run deploy.sh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          debug: true
          script: |
            cd ${{ secrets.SCRIPT_PATH }}
            ./${{ secrets.SCRIPT }}
